function getSceneAtTime(t) {
  for (let i = 0; i < SCENES.length; i++) {
    const s = SCENES[i];
    if (t >= s.startTime && t < s.startTime + s.duration) {
      return { scene: s, index: i, progress: (t - s.startTime) / s.duration };

  }
  return { scene: SCENES[SCENES.length - 1], index: SCENES.length - 1, progress: 1.0 };

function drawDynamicBackground(scene) {
  const grad = ctx.createRadialGradient(960, 540, 100, 960, 540, 1200);
  
  if (scene.id === "hook") {
    grad.addColorStop(0, "#1f1424");
    grad.addColorStop(0.5, "#130a17");
    grad.addColorStop(1, "#07020a");
  } else if (scene.id === "boms" || scene.id === "production") {
    grad.addColorStop(0, "#062b1e");
    grad.addColorStop(0.5, "#041b13");
    grad.addColorStop(1, "#010d09");
  } else {
    grad.addColorStop(0, "#083726");
    grad.addColorStop(0.5, "#042017");
    grad.addColorStop(1, "#020f0a");
  }

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 1920, 1080);

  // Digital Grid
  ctx.strokeStyle = "rgba(16, 185, 129, 0.05)";
  ctx.lineWidth = 1;
  for (let x = 0; x < 1920; x += 80) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 1080); ctx.stroke();
  }
  for (let y = 0; y < 1080; y += 80) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1920, y); ctx.stroke();
  }

  // Glowing Ambient Halo
  const haloX = 960 + Math.sin(currentTime * 0.6) * 200;
  const haloY = 540 + Math.cos(currentTime * 0.5) * 120;
  const hGrad = ctx.createRadialGradient(haloX, haloY, 20, haloX, haloY, 700);

  ctx.fillStyle = hGrad;
  ctx.fillRect(0, 0, 1920, 1080);
}

    ctx.fillStyle = card.color;
    roundRect(ctx, cx + 30, cy + 28, 44, 6, 3, true, false);

    ctx.fillStyle = "#ffffff";
    ctx.font = "700 26px 'Plus Jakarta Sans'";

    ctx.font = "400 20px 'Plus Jakarta Sans'";

  });

  ctx.restore();
}

function renderFeatureScene(scene, progress) {

      ctx.fillStyle = "#e2e8f0";
      ctx.font = "700 20px 'Plus Jakarta Sans'";
      ctx.fillText(b, 180, by + 34);
    });
  }
  ctx.restore();

  if (scene.shot && imageCache[scene.shot] && imageCache[scene.shot].complete) {
    const img = imageCache[scene.shot];
    ctx.save();

    const zoom = 1.0 + Math.sin(progress * Math.PI) * 0.03;
    const targetW = 980 * zoom;
    const targetH = 680 * zoom;
    const posX = 860 - (targetW - 980) / 2;
    const posY = 180 - (targetH - 680) / 2;

    ctx.shadowColor = "rgba(16, 185, 129, 0.35)";
    ctx.shadowBlur = 45;
    ctx.shadowOffsetX = 10;
    ctx.shadowOffsetY = 20;

    ctx.drawImage(img, posX, posY, targetW, targetH);

    if (scene.callout) {
      const calloutPulse = 1.0 + Math.sin(currentTime * 3) * 0.05;
      ctx.save();
      ctx.translate(scene.callout.x, scene.callout.y);
      ctx.scale(calloutPulse, calloutPulse);

      ctx.fillStyle = "rgba(5, 150, 105, 0.95)";
      ctx.strokeStyle = "#6ee7b7";
      ctx.lineWidth = 2;
      ctx.shadowColor = "#10b981";
      ctx.shadowBlur = 15;
      roundRect(ctx, -140, -22, 280, 44, 22, true, true);

      ctx.fillStyle = "#ffffff";
      ctx.font = "800 15px 'Space Grotesk'";
      ctx.textAlign = "center";
      ctx.fillText("✦ " + scene.callout.text, 0, 6);
      ctx.restore();
    }
    ctx.restore();
  }
}

function renderFrameAtTime(t) {
  const { scene, index, progress } = getSceneAtTime(t);
  drawDynamicBackground(scene);

  if (scene.id === "hook") renderHook(scene, progress);
  else if (scene.id === "cta") renderCta(scene, progress);
  else renderFeatureScene(scene, progress);
}

function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.lineTo(x + width - radius, y);
  ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
  ctx.lineTo(x + width, y + height - radius);
  ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
  ctx.lineTo(x + radius, y + height);
  ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
  ctx.lineTo(x, y + radius);
  ctx.quadraticCurveTo(x, y, x + radius, y);
  ctx.closePath();
  if (fill) ctx.fill();
  if (stroke) ctx.stroke();
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
  const words = text.split(' ');
  let line = '';
  for (let n = 0; n < words.length; n++) {
    const testLine = line + words[n] + ' ';
    const metrics = ctx.measureText(testLine);
    const testWidth = metrics.width;
    if (testWidth > maxWidth && n > 0) {
      ctx.fillText(line, x, y);
      line = words[n] + ' ';
      y += lineHeight;
    } else {
      line = testLine;
    }
  }
  ctx.fillText(line, x, y);
}

function updateUI() {
  const { scene, index } = getSceneAtTime(currentTime);

  captionCat.innerText = scene.category;
  captionText.innerText = scene.caption;

  const pct = (currentTime / TOTAL_DURATION) * 100;
  timelineProgress.style.width = `${pct}%`;

  const curM = Math.floor(currentTime / 60);
  const curS = Math.floor(currentTime % 60);
  const totM = Math.floor(TOTAL_DURATION / 60);
  const totS = Math.floor(TOTAL_DURATION % 60);
  timeDisplay.innerText = `${pad(curM)}:${pad(curS)} / ${pad(totM)}:${pad(totS)}`;

  const pills = document.querySelectorAll(".scene-pill");
  pills.forEach((p, idx) => {
    p.classList.toggle("active", idx === index);
  });
}

function pad(n) { return n < 10 ? "0" + n : n; }

// Animation Loop: STRICTLY DRIVEN BY AUDIO PLAYHEAD
function loop() {
  if (isPlaying) {
    currentTime = masterAudio.currentTime;

    if (masterAudio.ended || currentTime >= TOTAL_DURATION) {
      isPlaying = false;
      playBtn.innerText = "▶";
      currentTime = 0;
      masterAudio.currentTime = 0;
    }
    updateUI();
  }

  renderFrameAtTime(currentTime);
  requestAnimationFrame(loop);
}

playBtn.onclick = () => {
  isPlaying = !isPlaying;
  playBtn.innerText = isPlaying ? "⏸" : "▶";
  if (isPlaying) {
    masterAudio.play().catch(e => console.log(e));
  } else {
    masterAudio.pause();
  }
};

document.getElementById("restartBtn").onclick = () => {
  currentTime = 0;
  masterAudio.currentTime = 0;
  updateUI();
  if (isPlaying) masterAudio.play();
};

audioToggleBtn.onclick = () => {
  masterAudio.muted = !masterAudio.muted;
  audioToggleBtn.classList.toggle("active", !masterAudio.muted);
  audioToggleBtn.innerText = masterAudio.muted ? "🔇" : "🔊";
};

document.getElementById("timelineBar").onclick = (e) => {
  const rect = e.currentTarget.getBoundingClientRect();
  const clickX = e.clientX - rect.left;
  const ratio = clickX / rect.width;
  currentTime = ratio * TOTAL_DURATION;
  masterAudio.currentTime = currentTime;
  updateUI();
};

// Global API for Automated Synchronized Video Export
window.startSyncedPlayback = () => {
  currentTime = 0.0;
  masterAudio.currentTime = 0.0;
  isPlaying = true;
  playBtn.innerText = "⏸";
  masterAudio.play().catch(e => console.log(e));
};

// Initial Render
updateUI();
renderFrameAtTime(0);
requestAnimationFrame(loop);
</script>
